:root {
  --bg-color: #0f172a;
  --card-bg: rgba(30, 41, 59, 0.7);
  --text-color: #f8fafc;
  --accent-color: #ef4444;
  /* Red-500 */
  --bit-off: rgba(255, 255, 255, 0.1);
  --bit-border: rgba(255, 255, 255, 0.1);
  --input-bg: rgba(15, 23, 42, 0.6);
  --glass-border: 1px solid rgba(255, 255, 255, 0.08);
  --panel-bg: rgba(15, 23, 42, 0.4);
}

body {
  margin: 0;
  padding: 0;
  font-family: 'Space Grotesk', 'Noto Sans TC', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  background-color: var(--bg-color);
  background-image:
    radial-gradient(at 0% 0%, rgba(239, 68, 68, 0.15) 0px, transparent 50%),
    radial-gradient(at 100% 100%, rgba(59, 130, 246, 0.15) 0px, transparent 50%);
  background-attachment: fixed;
  color: var(--text-color);
  display: flex;
  min-height: 100vh;
  padding: 2vh 0;
  box-sizing: border-box;
}

.app-container {
  background: var(--card-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  padding: 2rem;
  border-radius: 24px;
  border: var(--glass-border);
  box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
  max-width: 1000px;
  width: 95%;
  min-height: 85vh;
  margin: auto;
  display: flex;
  flex-direction: column;
  position: relative;
  overflow: hidden;
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  gap: 1rem;
  margin-bottom: 2rem;
  flex-shrink: 0;
}

header {
  text-align: left;
  flex-shrink: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: 0.25rem;
}

/* Language switch */
.lang-switch {
  margin-left: auto;
  align-self: flex-start;
  display: inline-flex;
  gap: 2px;
  background: var(--panel-bg);
  border: var(--glass-border);
  border-radius: 999px;
  padding: 3px;
}

.lang-btn {
  background: transparent;
  border: none;
  color: #94a3b8;
  font-family: inherit;
  font-weight: 600;
  font-size: 0.8rem;
  line-height: 1;
  padding: 0.4rem 0.7rem;
  border-radius: 999px;
  cursor: pointer;
  transition: all 0.2s;
  white-space: nowrap;
}

.lang-btn:hover {
  color: white;
}

.lang-btn.active {
  background: var(--accent-color);
  color: white;
}

/* Pixel-art preview */
.preview-box {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.5rem;
  background: var(--panel-bg);
  border: var(--glass-border);
  border-radius: 12px;
  padding: 0.75rem;
}

.preview-label {
  font-size: 0.7rem;
  font-weight: 600;
  color: #94a3b8;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  white-space: nowrap;
}

.preview-canvas {
  width: 64px;
  height: 64px;
  image-rendering: pixelated;
  border-radius: 2px;
  background: #ffffff;
  border: 1px solid rgba(255, 255, 255, 0.1);
  display: block;
}

header h1 {
  font-weight: 700;
  font-size: 2rem;
  margin: 0 0 0.5rem 0;
  background: linear-gradient(to right, #fff, #94a3b8);
  -webkit-background-clip: text;
  background-clip: text;
  -webkit-text-fill-color: transparent;
}

header p {
  color: #94a3b8;
  margin: 0;
  font-size: 1rem;
}

/* Main Layout */
.main-layout {
  display: grid;
  grid-template-columns: 280px 1fr;
  gap: 2rem;
  flex: 1;
  min-height: 0;
  align-items: start;
}

/* Input Panel */
.input-panel {
  background: var(--panel-bg);
  border-radius: 16px;
  padding: 1.5rem;
  border: var(--glass-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  height: 100%;
  box-sizing: border-box;
}

.panel-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 0px;
  height: 40px;
  flex-shrink: 0;
}

.panel-header h2 {
  font-size: 1.2rem;
  margin: 0;
  color: #e2e8f0;
}

.inputs-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  /* Increased to 8px for square grid match */
  margin-top: 1rem;
}

.input-group {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0, 0, 0, 0.2);
  padding: 0 0.75rem;
  border-radius: 8px;
  border: 1px solid transparent;
  transition: all 0.2s ease;
  height: 32px;
  /* Matches bit height for square grid */
  box-sizing: border-box;
}

.input-group:hover {
  background: rgba(0, 0, 0, 0.4);
  border-color: rgba(255, 255, 255, 0.1);
}

.input-group:focus-within {
  border-color: var(--accent-color);
  background: rgba(0, 0, 0, 0.5);
  box-shadow: 0 0 0 2px rgba(239, 68, 68, 0.2);
}

.input-group label {
  font-size: 0.85rem;
  color: #cbd5e1;
  /* Brighter label */
  font-weight: 500;
}

.decimal-input {
  background: transparent;
  border: none;
  color: white;
  font-family: 'Space Grotesk', ui-monospace, SFMono-Regular, Menlo, Consolas, 'Courier New', monospace;
  font-size: 1rem;
  width: 60px;
  text-align: right;
  outline: none;
  padding: 0;
}

.decimal-input:focus {
  color: var(--accent-color);
  /* Kept text color accent */
}

/* Display Panel */
.display-panel {
  display: flex;
  flex-direction: column;
  justify-content: flex-start;
  padding: 1.5rem;
  background: rgba(0, 0, 0, 0.1);
  border-radius: 16px;
  height: 100%;
  box-sizing: border-box;
}

.patterns-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  /* Strict match to inputs-list (8px) */
  margin-top: 1rem;
  /* Match input-list margin */
}

.bit-row {
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 0;
  border-radius: 0;
  transition: background 0.2s;
  height: 32px;
  /* Match input-group height */
}

.bit-row:hover {
  background: rgba(255, 255, 255, 0.03);
}

.bits-container {
  display: flex;
  gap: 8px;
  /* 8px horizontal gap for perfect square */
}

.bit {
  width: 32px;
  height: 32px;
  border-radius: 4px;
  background: var(--bit-off);
  border: var(--glass-border);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  position: relative;
  overflow: hidden;
  box-sizing: border-box;
  cursor: pointer;
  /* Interactive */
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 0.8rem;
  font-weight: 700;
  user-select: none;
}

.bit:hover {
  background: rgba(255, 255, 255, 0.2);
  /* Hover affordance */
  border-color: rgba(255, 255, 255, 0.3);
}

.bit::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0) 100%);
}

.bit.active {
  background: var(--accent-color);
  box-shadow: 0 0 15px rgba(239, 68, 68, 0.4);
  border-color: rgba(239, 68, 68, 0.5);
  transform: scale(1.05);
}

/* Mobile Toggle - Top Left */
.mobile-toggle {
  display: none;
  position: absolute;
  top: 1.5rem;
  left: 1.5rem;
  width: 48px;
  height: 48px;
  border-radius: 12px;
  background: var(--card-bg);
  border: var(--glass-border);
  color: white;
  backdrop-filter: blur(10px);
  z-index: 100;
  cursor: pointer;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}

.mobile-toggle:active {
  transform: scale(0.95);
  background: var(--accent-color);
}

/* Secondary Button Styles */
.display-controls {
  margin-top: 2.25rem;
  display: flex;
  justify-content: center;
  gap: 12px;
  flex-wrap: wrap;
}

.secondary-btn {
  background: rgba(255, 255, 255, 0.05);
  border: var(--glass-border);
  color: #cbd5e1;
  padding: 0.6rem 1.2rem;
  border-radius: 8px;
  font-family: 'Space Grotesk', 'Noto Sans TC', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', 'Helvetica Neue', 'PingFang TC', 'Microsoft JhengHei', sans-serif;
  font-weight: 600;
  font-size: 0.9rem;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}

.btn-icon {
  width: 16px;
  height: 16px;
  flex-shrink: 0;
}

.secondary-btn:hover {
  background: rgba(255, 255, 255, 0.1);
  color: white;
}

.secondary-btn:active {
  transform: scale(0.98);
}

.secondary-btn.active {
  background: var(--accent-color);
  color: white;
  border-color: transparent;
}

/* Clear All: hint at a destructive action on hover */
.secondary-btn.danger:hover {
  background: var(--accent-color);
  color: white;
  border-color: transparent;
}

/* Hide spin buttons */
.decimal-input::-webkit-outer-spin-button,
.decimal-input::-webkit-inner-spin-button {
  -webkit-appearance: none;
  margin: 0;
}

/* Footer Styles */
.credits {
  display: flex;
  align-items: center;
  gap: 8px;
  color: #64748b;
  font-size: 0.75rem;
  font-weight: 500;
  margin-top: 0.25rem;
}

.credit-icon {
  width: 14px;
  height: 14px;
  object-fit: contain;
}

.credit-icon.avatar {
  border-radius: 50%;
  border: 1px solid rgba(255, 255, 255, 0.1);
}

.credit-link {
  color: #94a3b8;
  text-decoration: none;
  transition: all 0.2s ease;
  display: inline-flex;
  align-items: center;
  gap: 4px;
}

.credit-link:hover {
  color: #60a5fa;
  text-decoration: underline;
}

.close-btn {
  background: transparent;
  border: none;
  color: #fff;
  font-size: 1.5rem;
  cursor: pointer;
}

.mobile-only {
  display: none;
}

/* Saved sprites panel */
.saved-panel {
  flex-shrink: 0;
  margin-top: 1.5rem;
  padding-top: 1rem;
  border-top: var(--glass-border);
}

.saved-header h2 {
  font-size: 1rem;
  margin: 0 0 0.75rem 0;
  color: #e2e8f0;
}

.saved-hint {
  font-size: 0.75rem;
  font-weight: 400;
  color: #64748b;
}

.saved-list {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
  align-items: center;
  min-height: 48px;
}

.saved-empty {
  font-size: 0.85rem;
  color: #64748b;
}

.saved-item {
  padding: 0;
  border: 1px solid rgba(255, 255, 255, 0.12);
  border-radius: 4px;
  background: #fff;
  cursor: pointer;
  line-height: 0;
  transition: all 0.2s;
}

.saved-item:hover {
  border-color: var(--accent-color);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px rgba(0, 0, 0, 0.4);
}

.saved-thumb {
  width: 48px;
  height: 48px;
  image-rendering: pixelated;
  border-radius: 3px;
  display: block;
}

/* Responsive & Mobile */
@media (max-width: 700px) {
  .app-container {
    min-height: 100vh;
    width: 100%;
    border-radius: 0;
    padding: 1rem;
    padding-top: 5rem;
  }

  .main-layout {
    grid-template-columns: 1fr;
    gap: 0;
    overflow-y: auto;
    display: block;
    flex: none;
  }

  .patterns-list {
    margin-top: 0;
  }

  /* Input panel becomes a drawer or overlay on mobile */
  .input-panel {
    position: fixed;
    top: 0;
    left: 0;
    width: 300px;
    height: 100%;
    z-index: 200;
    background: #0f172a;
    border-right: 1px solid rgba(255, 255, 255, 0.1);
    transform: translateX(-100%);
    transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    box-shadow: 10px 0 50px rgba(0, 0, 0, 0.5);
    padding-top: 5rem;
    /* Space for hidden toggle area so controls are lower? No, toggle is z-index 100, drawer 200. Drawer covers toggle? */
    /* Let's keep toggle visible or allow closing via X */
  }

  .input-panel.active {
    transform: translateX(0);
  }

  .display-panel {
    background: transparent;
    padding: 0;
    height: auto;
  }

  .mobile-toggle {
    display: flex;
  }

  .mobile-only {
    display: block;
  }

  /* On mobile, we hide the desktop "Patterns" header, 
     but the inputs panel has its own header. */
  .desktop-hidden {
    display: none;
  }

  .bits-container {
    justify-content: center;
  }

  header h1 {
    font-size: 1.5rem;
  }

  .top-bar {
    gap: 0.75rem;
    flex-wrap: wrap;
  }
}
  </style>
</head>

              <circle cx="18" cy="19" r="3"></circle>
              <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"></line>
              <line x1="15.41" y1="6.51" x2="8.59" y2="10.49"></line>

    <!-- Saved sprites (persisted in this browser) -->

        <h2><span data-i18n="savedTitle">Saved sprites</span> <span class="saved-hint" data-i18n="savedHint">— up to 6

  <script>
document.addEventListener('DOMContentLoaded', () => {
    const inputs = document.querySelectorAll('.decimal-input');
    const bitRows = document.querySelectorAll('.bit-row');
    const toggleViewBtn = document.getElementById('toggle-view');

    let showBits = false;

    // --- Bilingual UI (English / Traditional Chinese) ---
    const I18N = {
        en: {
            title: 'Bit Pattern Converter',
            subtitle: 'Visualize 8-bit integers as binary patterns',
            by: 'By',
            previewLabel: 'Preview Pixel Art',
            previewAria: 'Combined 8 by 8 pixel-art preview of all rows',
            toggleInputsAria: 'Toggle inputs',
            closeAria: 'Close',
            inputs: 'Inputs',
            patterns: 'Patterns',
            rowLabel: 'Row {n}',
            bitAria: 'Row {row}, bit value {weight}',
            showBits: 'Show Bits',
            showPattern: 'Show Pattern',
            clearAll: 'Clear All',
            save: 'Save',
            shareClassroom: 'Share to Classroom',
            savedTitle: 'Saved sprites',
            savedHint: '— up to 6 most recent sprites',
            savedEmpty: 'Click Save to keep a sprite here (up to 6).',
            loadSprite: 'Load this sprite',
            confirmLoad: 'Load this saved sprite? Your current drawing will be replaced.'
        },
        zh: {
            title: '位元樣式轉換器',
            subtitle: '以二進制樣式呈現 8 位元整數',
            by: '作者',
            previewLabel: '像素藝術預覽',
            previewAria: '由所有行合併而成的 8×8 像素藝術預覽',
            toggleInputsAria: '開關輸入面板',
            closeAria: '關閉',
            inputs: '輸入',
            patterns: '樣式',
            rowLabel: '第 {n} 行',
            bitAria: '第 {row} 行，位元值 {weight}',
            showBits: '顯示位元',
            showPattern: '顯示樣式',
            clearAll: '全部清除',
            save: '儲存',
            shareClassroom: '分享至 Classroom',
            savedTitle: '已儲存的精靈圖 (sprite)',
            savedHint: '— 最多保留最近 6 個精靈圖',
            savedEmpty: '按「儲存」即可把精靈圖保留在這裡（最多 6 個）。',
            loadSprite: '載入此精靈圖',
            confirmLoad: '要載入這個已儲存的精靈圖嗎？目前的圖案將會被取代。'
        }
    };

    const LANG_KEY = 'bpc-lang';
    let lang = 'en';
    try { if (localStorage.getItem(LANG_KEY) === 'zh') lang = 'zh'; } catch (e) { /* default English */ }

    const t = (key) => I18N[lang][key];

    // Parse and clamp any raw value to a valid 8-bit integer (0-255)
    const clamp255 = (value) => {
        let n = parseInt(value);
        if (isNaN(n) || n < 0) n = 0;
        if (n > 255) n = 255;
        return n;
    };

    // --- Pixel Art Preview (all 8 rows combined into an 8x8 sprite) ---
    const previewCanvas = document.getElementById('preview-canvas');
    const pctx = previewCanvas ? previewCanvas.getContext('2d') : null;

    // Paint an 8x8 sprite (from 8 row values) onto a 64x64 canvas context
    const paintSprite = (ctx, values) => {
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, 64, 64);
        values.forEach((val, row) => {
            const binary = clamp255(val).toString(2).padStart(8, '0');
            for (let col = 0; col < 8; col++) {
                if (binary[col] === '1') {
                    ctx.fillStyle = '#ef4444';
                    ctx.fillRect(col * 8, row * 8, 8, 8);
                }
            }
        });
    };

    const currentValues = () => Array.from(inputs).map(input => clamp255(input.value));

    const drawPreview = () => {
        if (!pctx) return;
        paintSprite(pctx, currentValues());
    };

    // --- Core Logic: Map Input Index to Bit Row ---

    const updateBitDisplay = (index, value) => {
        const intVal = clamp255(value);

        // Binary string
        const binaryString = intVal.toString(2).padStart(8, '0');

        // Find corresponding bit row
        const targetRow = bitRows[index];
        if (!targetRow) return;

        const bits = targetRow.querySelectorAll('.bit');
        bits.forEach((bit, bitIndex) => {
            const bitValue = binaryString[bitIndex];

            // Update Visual Pattern
            if (bitValue === '1') {
                bit.classList.add('active');
            } else {
                bit.classList.remove('active');
            }
            bit.setAttribute('aria-pressed', bitValue === '1' ? 'true' : 'false');

            // Update Text Content (0 or 1)
            if (showBits) {
                bit.textContent = bitValue;
            } else {
                bit.textContent = '';
            }
        });

        // Keep the combined pixel-art preview in sync
        drawPreview();
    };

    const refreshAllDisplays = () => {
        inputs.forEach((input, index) => {
            updateBitDisplay(index, input.value || 0);
        });
    };

    // --- Event Listeners for Inputs ---

    inputs.forEach((input, index) => {
        input.addEventListener('input', (e) => {
            const raw = e.target.value;

            // Validate limits in real-time (leave empty string alone so typing isn't interrupted)
            if (raw !== '') {
                const clamped = clamp255(raw);
                if (String(clamped) !== raw) e.target.value = clamped;
            }

            updateBitDisplay(index, e.target.value);
            updateHash();
        });

        // Initialize display
        updateBitDisplay(index, input.value || 0);
    });

    // --- Interactive Bits Logic ---

    bitRows.forEach((row, rowIndex) => {
        const bits = row.querySelectorAll('.bit');
        bits.forEach((bit, bitIndex) => {
            // Bits are index 0 (MSB, 128) to 7 (LSB, 1)
            const weight = Math.pow(2, 7 - bitIndex);

            // Make each bit keyboard-operable, not just clickable
            bit.setAttribute('role', 'button');
            bit.tabIndex = 0;
            bit.dataset.row = rowIndex + 1;
            bit.dataset.weight = weight;
            bit.setAttribute('aria-label',
                t('bitAria').replace('{row}', rowIndex + 1).replace('{weight}', weight));

            const toggleBit = () => {
                const input = inputs[rowIndex];
                const currentValue = parseInt(input.value) || 0;

                // XOR to toggle the bit in the integer
                const newValue = currentValue ^ weight;

                // Update State
                input.value = newValue;
                updateBitDisplay(rowIndex, newValue);
                updateHash();
            };

            bit.addEventListener('click', toggleBit);
            bit.addEventListener('keydown', (e) => {
                if (e.key === 'Enter' || e.key === ' ') {
                    e.preventDefault();
                    toggleBit();
                }
            });
        });
    });


    // --- Toggle View Logic ---
    const toggleViewLabel = toggleViewBtn ? toggleViewBtn.querySelector('.btn-label') : null;
    const updateToggleViewLabel = () => {
        if (toggleViewLabel) toggleViewLabel.textContent = showBits ? t('showPattern') : t('showBits');
    };
    if (toggleViewBtn) {
        toggleViewBtn.addEventListener('click', () => {
            showBits = !showBits;
            toggleViewBtn.classList.toggle('active', showBits);
            updateToggleViewLabel();
            refreshAllDisplays();
        });
    }


    // --- Clear All Logic ---
    const clearAllBtn = document.getElementById('clear-all');
    if (clearAllBtn) {
        clearAllBtn.addEventListener('click', () => {
            inputs.forEach((input, index) => {
                input.value = '';
                updateBitDisplay(index, 0);
            });
            updateHash();
        });
    }


    // --- Save / Gallery (persisted in this browser) ---
    const SAVE_KEY = 'bpc-saved-sprites';
    const MAX_SAVED = 6;
    const savedList = document.getElementById('saved-list');

    const readSaved = () => {
        try { return JSON.parse(localStorage.getItem(SAVE_KEY)) || []; }
        catch (e) { return []; }
    };
    const writeSaved = (arr) => {
        try { localStorage.setItem(SAVE_KEY, JSON.stringify(arr)); }
        catch (e) { /* storage unavailable (e.g. private mode) */ }
    };

    const renderSaved = () => {
        if (!savedList) return;
        const saved = readSaved();
        savedList.innerHTML = '';
        if (saved.length === 0) {
            const hint = document.createElement('span');
            hint.className = 'saved-empty';
            hint.textContent = t('savedEmpty');
            savedList.appendChild(hint);
            return;
        }
        saved.forEach((values) => {
            const item = document.createElement('button');
            item.className = 'saved-item';
            item.title = t('loadSprite');
            item.setAttribute('aria-label', t('loadSprite'));
            const cv = document.createElement('canvas');
            cv.width = 64;
            cv.height = 64;
            cv.className = 'saved-thumb';
            paintSprite(cv.getContext('2d'), values);
            item.appendChild(cv);
            item.addEventListener('click', () => {
                const hasDrawing = currentValues().some(v => v !== 0);
                if (hasDrawing && !confirm(t('confirmLoad'))) return;
                inputs.forEach((input, idx) => { input.value = values[idx]; });
                refreshAllDisplays();
                updateHash();
            });
            savedList.appendChild(item);
        });
    };

    const saveBtn = document.getElementById('save-btn');
    if (saveBtn) {
        saveBtn.addEventListener('click', () => {
            const values = currentValues();
            if (values.every(v => v === 0)) return; // nothing drawn yet
            const saved = readSaved();
            saved.unshift(values);
            writeSaved(saved.slice(0, MAX_SAVED));
            renderSaved();
        });
    }

    // --- Share to Google Classroom ---
    const shareBtn = document.getElementById('share-btn');
    if (shareBtn) {
        shareBtn.addEventListener('click', () => {
            updateHash(); // make sure the URL reflects the current drawing
            const shareUrl = 'https://classroom.google.com/share?url=' +
                encodeURIComponent(window.location.href);
            window.open(shareUrl, '_blank', 'noopener,width=600,height=650');
        });
    }

    // --- Language Switch ---
    const langButtons = document.querySelectorAll('.lang-btn');

    const applyI18n = () => {
        document.documentElement.lang = lang === 'zh' ? 'zh-Hant' : 'en';
        document.title = t('title');

        document.querySelectorAll('[data-i18n]').forEach((el) => {
            let text = t(el.dataset.i18n);
            if (el.dataset.row) text = text.replace('{n}', el.dataset.row);
            el.textContent = text;
        });
        document.querySelectorAll('[data-i18n-aria]').forEach((el) => {
            el.setAttribute('aria-label', t(el.dataset.i18nAria));
        });
        document.querySelectorAll('.bit').forEach((bit) => {
            bit.setAttribute('aria-label',
                t('bitAria').replace('{row}', bit.dataset.row).replace('{weight}', bit.dataset.weight));
        });

        langButtons.forEach((btn) => {
            btn.classList.toggle('active', btn.dataset.lang === lang);
        });

        updateToggleViewLabel();
        renderSaved();
    };

    langButtons.forEach((btn) => {
        btn.addEventListener('click', () => {
            if (btn.dataset.lang === lang) return;
            lang = btn.dataset.lang;
            try { localStorage.setItem(LANG_KEY, lang); } catch (e) { /* storage unavailable */ }
            applyI18n();
        });
    });

    applyI18n();


    // --- URL Hash State Management ---

    const updateHash = () => {
        const values = Array.from(inputs).map(input => input.value || '0');
        window.location.hash = values.join(',');
    };

    const loadFromHash = () => {
        const hash = window.location.hash.slice(1);
        if (!hash) return;

        const values = hash.split(',');
        inputs.forEach((input, index) => {
            if (values[index] === undefined) return;
            // Clamp so the input field always matches what the bits/preview show
            const clamped = String(clamp255(values[index]));
            if (input.value !== clamped) {
                input.value = clamped;
                updateBitDisplay(index, clamped);
            }
        });
    };

    window.addEventListener('hashchange', loadFromHash);

    // Initial Load
    if (window.location.hash) {
        loadFromHash();
    }


    // --- Mobile Interface Logic ---

    const toggleBtn = document.getElementById('toggle-inputs');
    const closeBtn = document.getElementById('close-inputs');
    const inputPanel = document.getElementById('input-panel');

    const toggleMenu = () => {
        inputPanel.classList.toggle('active');
    };

    if (toggleBtn) toggleBtn.addEventListener('click', toggleMenu);
    if (closeBtn) closeBtn.addEventListener('click', toggleMenu);

});
